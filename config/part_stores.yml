# Tiendas donde "Buscar repuesto" arma la búsqueda, en el orden en que se muestran.
# Cada url puede usar %{query} (texto codificado para un parámetro) o %{slug} (palabras-con-guion).
shared:
  stores:
    - name: "Google Shopping"
      url: "https://www.google.com/search?tbm=shop&gl=cl&hl=es&q=%{query}"
    - name: "Mercado Libre"
      url: "https://listado.mercadolibre.cl/%{slug}"
