      work_order_task: "tarea"
    errors:
      models:
        user:
          attributes:
            password:
              too_short:
                one: "es demasiado corta (mínimo 1 carácter)"
                other: "es demasiado corta (mínimo %{count} caracteres)"
              too_long:
