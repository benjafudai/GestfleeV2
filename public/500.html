  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      font-family: 'Lato', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #1d2a3b;
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(31, 111, 209, 0.12), transparent 60%),
        linear-gradient(180deg, #eaf1fb 0%, #f5f8fc 100%);
      background-color: #f2f5f9;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 40px 32px;
      background: #fff;
      border: 1px solid #e2e7ee;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(16, 32, 64, 0.14);
      text-align: center;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 32px; text-align: left; text-decoration: none; color: inherit; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; flex-shrink: 0; border-radius: 7px; background: #f97316; color: #fff; }
    .brand-name { display: block; font-weight: 900; font-size: 1.02rem; line-height: 1.1; letter-spacing: 0.01em; }
    .brand-sub { display: block; font-size: 0.7rem; color: #5f6e83; }
    .icon { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 50%; background: #fdeeee; color: #b02e2e; }
    .code { display: inline-block; margin-bottom: 10px; padding: 3px 10px; border-radius: 999px; background: #f7f9fc; border: 1px solid #e2e7ee; color: #5f6e83; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; line-height: 1.3; font-weight: 700; }
    p { margin: 0 0 26px; color: #5f6e83; font-size: 0.92rem; line-height: 1.55; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 22px;
      border-radius: 8px; background: #1f6fd1; color: #fff;
      font-weight: 700; font-size: 0.95rem; text-decoration: none; white-space: nowrap;
      transition: background-color .15s;
    }
    .btn:hover { background: #164f96; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(31, 111, 209, 0.25); }
    .foot { margin: 28px 0 0; font-size: 0.75rem; color: #9aa7b8; }
    @media (max-width: 480px) {
      .card { padding: 32px 22px 24px; }
      .btn { width: 100%; }
    }
  </style>
</head>
